<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and glows -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    
    <!-- Code Brackets (Cyan) Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <!-- Circuit Board (Green) Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f2937" stroke-width="4" />

  <!-- PCB Circuit Traces / Background Grid (Subtle) -->
  <path d="M 64 64 L 128 128 M 448 64 L 384 128 M 64 448 L 128 384 M 448 448 L 384 384" 
        stroke="#1e293b" stroke-width="6" stroke-linecap="round" opacity="0.3" />

  <!-- LEFT BRACKET (Code & Circuits) -->
  <!-- Circuit traces connecting bracket to chip -->
  <path d="M 120 230 H 206 M 120 282 H 206" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- The main left bracket -->
  <path d="M 190 130 L 95 256 L 190 382" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminals (Pads) for Left Bracket -->
  <circle cx="190" cy="130" r="18" fill="#00f2fe" />
  <circle cx="190" cy="382" r="18" fill="#00f2fe" />


  <!-- RIGHT BRACKET (Code & Circuits) -->
  <!-- Circuit traces connecting bracket to chip -->
  <path d="M 392 230 H 306 M 392 282 H 306" stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />
  
  <!-- The main right bracket -->
  <path d="M 322 130 L 417 256 L 322 382" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Terminals (Pads) for Right Bracket -->
  <circle cx="322" cy="130" r="18" fill="#00f2fe" />
  <circle cx="322" cy="382" r="18" fill="#00f2fe" />


  <!-- CENTRAL MICROCHIP -->
  <!-- Top/Bottom Pins -->
  <path d="M 236 206 V 160 M 276 206 V 160 M 236 306 V 352 M 276 306 V 352" 
        stroke="url(#greenGrad)" stroke-width="12" stroke-linecap="round" />
  <!-- Top/Bottom Pin Terminals -->
  <circle cx="236" cy="160" r="10" fill="#34d399" />
  <circle cx="276" cy="160" r="10" fill="#34d399" />
  <circle cx="236" cy="352" r="10" fill="#34d399" />
  <circle cx="276" cy="352" r="10" fill="#34d399" />

  <!-- Microchip Body -->
  <rect x="206" y="206" width="100" height="100" rx="20" 
        fill="#111827" stroke="url(#greenGrad)" stroke-width="10" />
  
  <!-- Lightning Bolt / Power Symbol (representing EV Power & Robotics) -->
  <path d="M 264 222 L 234 262 H 262 L 248 294 L 278 254 H 250 Z" 
        fill="#34d399" filter="url(#glow)" />
</svg>
